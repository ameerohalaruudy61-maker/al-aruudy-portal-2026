<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teacher Registration | Al-Aruudy International School</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 75, 30, 0.88),
                    rgba(0, 75, 30, 0.88)
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .registration-container {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            background: #08752f;
            color: #ffd500;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 36px;
            font-weight: bold;
        }

        .school-name {
            text-align: center;

            color: #08752f;

            font-size: 18px;
            font-weight: bold;

            margin-bottom: 5px;
        }

        h1 {
            text-align: center;

            color: #16351f;

            font-size: 27px;

            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #16351f;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d5d5d5;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #08752f;

            box-shadow:
                0 0 0 3px
                rgba(8, 117, 47, 0.1);
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 50px;
        }

        .eye-button {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 20px;
        }

        #passwordMessage {
            margin-top: 7px;

            font-size: 13px;

            font-weight: bold;

            min-height: 18px;
        }

        .register-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #08752f;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .register-button:hover {
            background: #055b24;
        }

        .register-button:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }

        .message {
            display: none;

            padding: 12px;

            margin-bottom: 18px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;
        }

        .message.success {
            display: block;

            background: #e7f7eb;

            color: #146c2e;

            border: 1px solid #b7e5c2;
        }

        .message.error {
            display: block;

            background: #fdeaea;

            color: #b42318;

            border: 1px solid #f2b8b5;
        }

        .login-link {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #08752f;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }

        .login-link:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="registration-container">


    <div class="logo">
        A
    </div>


    <div class="school-name">
        AL-ARUUDY INTERNATIONAL SCHOOL
    </div>


    <h1>
        Teacher Registration
    </h1>


    <div
        id="message"
        class="message"
    ></div>


    <form id="teacherRegistrationForm">


        <!-- TEACHER NAME -->

        <div class="input-group">

            <label for="teacherName">
                Teacher Full Name
            </label>

            <input
                type="text"
                id="teacherName"
                placeholder="Enter teacher's full name"
                autocomplete="name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="input-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter teacher's email"
                autocomplete="email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label for="password">
                Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="eye-button"
                    id="passwordEye"
                    aria-label="Show password"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="eye-button"
                    id="confirmEye"
                    aria-label="Show password"
                >
                    👁️
                </button>

            </div>

            <div id="passwordMessage"></div>

        </div>


        <button
            type="submit"
            class="register-button"
            id="registerButton"
        >
            Register Teacher
        </button>


    </form>


    <a
        href="teacher login.html"
        class="login-link"
    >
        Already registered? Go to Teacher Login
    </a>


</div>


<script>


    // ==================================================
    // ELEMENTS
    // ==================================================

    const form =
        document.getElementById(
            "teacherRegistrationForm"
        );


    const teacherName =
        document.getElementById(
            "teacherName"
        );


    const email =
        document.getElementById(
            "email"
        );


    const password =
        document.getElementById(
            "password"
        );


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );


    const passwordMessage =
        document.getElementById(
            "passwordMessage"
        );


    const passwordEye =
        document.getElementById(
            "passwordEye"
        );


    const confirmEye =
        document.getElementById(
            "confirmEye"
        );


    const registerButton =
        document.getElementById(
            "registerButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    // ==================================================
    // SHOW MESSAGE
    // ==================================================

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    // ==================================================
    // PASSWORD MATCH
    // ==================================================

    function checkPasswordMatch() {

        if (
            confirmPassword.value === ""
        ) {

            passwordMessage.textContent = "";

            return;

        }


        if (
            password.value ===
            confirmPassword.value
        ) {

            passwordMessage.textContent =
                "✓ Passwords match";

            passwordMessage.style.color =
                "#08752f";

        } else {

            passwordMessage.textContent =
                "✗ Passwords do not match";

            passwordMessage.style.color =
                "#d00000";

        }

    }


    password.addEventListener(
        "input",
        checkPasswordMatch
    );


    confirmPassword.addEventListener(
        "input",
        checkPasswordMatch
    );


    // ==================================================
    // PASSWORD EYE
    // ==================================================

    passwordEye.addEventListener(
        "click",
        function() {

            if (
                password.type ===
                "password"
            ) {

                password.type = "text";

                passwordEye.textContent =
                    "🙈";

                passwordEye.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                password.type = "password";

                passwordEye.textContent =
                    "👁️";

                passwordEye.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );


    // ==================================================
    // CONFIRM PASSWORD EYE
    // ==================================================

    confirmEye.addEventListener(
        "click",
        function() {

            if (
                confirmPassword.type ===
                "password"
            ) {

                confirmPassword.type =
                    "text";

                confirmEye.textContent =
                    "🙈";

                confirmEye.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                confirmPassword.type =
                    "password";

                confirmEye.textContent =
                    "👁️";

                confirmEye.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );


    // ==================================================
    // TEACHER REGISTRATION
    // ==================================================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            message.className =
                "message";


            const name =
                teacherName.value.trim();


            const emailValue =
                email.value.trim();


            const passwordValue =
                password.value;


            const confirmValue =
                confirmPassword.value;


            // ==================================================
            // VALIDATION
            // ==================================================

            if (!name) {

                showMessage(
                    "Please enter the teacher's full name.",
                    "error"
                );

                teacherName.focus();

                return;

            }


            if (!emailValue) {

                showMessage(
                    "Please enter the teacher's email.",
                    "error"
                );

                email.focus();

                return;

            }


            if (
                passwordValue.length < 6
            ) {

                showMessage(
                    "Password must be at least 6 characters long.",
                    "error"
                );

                password.focus();

                return;

            }


            if (
                passwordValue !==
                confirmValue
            ) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                confirmPassword.focus();

                return;

            }


            // ==================================================
            // DISABLE BUTTON
            // ==================================================

            registerButton.disabled = true;

            registerButton.textContent =
                "Registering...";


            try {

                // ==================================================
                // SEND TEACHER TO BACKEND
                // ==================================================

                const response =
                    await fetch(
                        "http://localhost:8000/teachers/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                fullName:
                                    name,

                                email:
                                    emailValue,

                                password:
                                    passwordValue,

                                assignedClass:
                                    ""

                            })

                        }
                    );


                // ==================================================
                // READ RESPONSE
                // ==================================================

                const data =
                    await response.json();


                // ==================================================
                // REGISTRATION FAILED
                // ==================================================

                if (
                    !response.ok ||
                    !data.success
                ) {

                    showMessage(
                        data.message ||
                        "Teacher registration failed.",
                        "error"
                    );

                    registerButton.disabled =
                        false;

                    registerButton.textContent =
                        "Register Teacher";

                    return;

                }


                // ==================================================
                // SUCCESS
                // ==================================================

                showMessage(
                    "Teacher registration successful! Redirecting to login...",
                    "success"
                );


                // ==================================================
                // REDIRECT TO LOGIN
                // ==================================================

                setTimeout(
                    function() {

                        window.location.href =
                            "teacher login.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "Teacher registration error:",
                    error
                );


                showMessage(
                    "Unable to connect to the server. Make sure your backend is running on http://localhost:8000.",
                    "error"
                );


                registerButton.disabled =
                    false;

                registerButton.textContent =
                    "Register Teacher";

            }

        }
    );

</script>


</body>

</html>
