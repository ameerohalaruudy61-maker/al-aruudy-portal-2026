<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | Al-Aruudy International School
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 75, 30, 0.88),
                    rgba(0, 75, 30, 0.88)
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .container {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);

        }


        .logo {

            width: 70px;

            height: 70px;

            margin: 0 auto 18px;

            background: #08752f;

            color: #ffd500;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 36px;

            font-weight: bold;

        }


        .school-name {

            text-align: center;

            color: #08752f;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        h1 {

            text-align: center;

            color: #16351f;

            font-size: 27px;

            margin-bottom: 10px;

        }


        .description {

            text-align: center;

            color: #666;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;

        }


        .input-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #16351f;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d5d5d5;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #08752f;

            box-shadow:
                0 0 0 3px rgba(8, 117, 47, 0.1);

        }


        .password-container {

            position: relative;

        }


        .password-container input {

            padding-right: 50px;

        }


        .eye-button {

            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 20px;

        }


        .reset-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #08752f;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .reset-button:hover {

            background: #055b24;

        }


        .reset-button:disabled {

            background: #8aaa96;

            cursor: not-allowed;

        }


        .message {

            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 7px;

            text-align: center;

            font-weight: bold;

            line-height: 1.5;

        }


        .error {

            display: block;

            background: #fdeaea;

            color: #c62828;

        }


        .success {

            display: block;

            background: #e8f7ed;

            color: #08752f;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #08752f;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

        }


        .back-link:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        A
    </div>


    <div class="school-name">
        AL-ARUUDY INTERNATIONAL SCHOOL
    </div>


    <h1>
        Forgot Password?
    </h1>


    <p class="description">
        Enter your teacher name and email, then create a new password for your account.
    </p>


    <div
        id="message"
        class="message"
    ></div>


    <form id="forgotPasswordForm">


        <!-- TEACHER NAME -->

        <div class="input-group">

            <label for="teacherName">
                Teacher Name
            </label>

            <input
                type="text"
                id="teacherName"
                placeholder="Enter your full teacher name"
                autocomplete="name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="input-group">

            <label for="teacherEmail">
                Email Address
            </label>

            <input
                type="email"
                id="teacherEmail"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

        </div>


        <!-- NEW PASSWORD -->

        <div class="input-group">

            <label for="newPassword">
                New Password
            </label>


            <div class="password-container">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="button"
                    class="eye-button"
                    id="newPasswordEye"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

            <label for="confirmPassword">
                Confirm New Password
            </label>


            <div class="password-container">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="button"
                    class="eye-button"
                    id="confirmPasswordEye"
                >
                    👁️
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="reset-button"
            id="resetButton"
        >
            Reset Password
        </button>


    </form>


    <a
        href="teacher login.html"
        class="back-link"
    >
        ← Back to Teacher Login
    </a>


</div>



<script>


const form =
    document.getElementById(
        "forgotPasswordForm"
    );


const teacherNameInput =
    document.getElementById(
        "teacherName"
    );


const teacherEmailInput =
    document.getElementById(
        "teacherEmail"
    );


const newPasswordInput =
    document.getElementById(
        "newPassword"
    );


const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );


const message =
    document.getElementById(
        "message"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const newPasswordEye =
    document.getElementById(
        "newPasswordEye"
    );


const confirmPasswordEye =
    document.getElementById(
        "confirmPasswordEye"
    );



/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}



/* =====================================================
   RESET PASSWORD
===================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const teacherName =
            teacherNameInput.value.trim();


        const teacherEmail =
            teacherEmailInput.value.trim();


        const newPassword =
            newPasswordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;



        /* =============================================
           CHECK EMPTY FIELDS
        ============================================= */

        if (
            !teacherName ||
            !teacherEmail ||
            !newPassword ||
            !confirmPassword
        ) {

            showMessage(
                "Please fill in all fields.",
                "error"
            );

            return;

        }



        /* =============================================
           CHECK EMAIL
        ============================================= */

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (
            !emailPattern.test(
                teacherEmail
            )
        ) {

            showMessage(
                "Please enter a valid email address.",
                "error"
            );

            return;

        }



        /* =============================================
           CHECK PASSWORD LENGTH
        ============================================= */

        if (
            newPassword.length < 6
        ) {

            showMessage(
                "Password must be at least 6 characters long.",
                "error"
            );

            return;

        }



        /* =============================================
           CHECK PASSWORD MATCH
        ============================================= */

        if (
            newPassword !==
            confirmPassword
        ) {

            showMessage(
                "The new passwords do not match.",
                "error"
            );

            return;

        }



        /* =============================================
           DISABLE BUTTON
        ============================================= */

        resetButton.disabled = true;

        resetButton.textContent =
            "Resetting Password...";



        try {


            /* =========================================
               SEND REQUEST TO DENO BACKEND
            ========================================= */

            const response =
                await fetch(
                    "http://localhost:8000/teachers/forgot-password",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                fullName:
                                    teacherName,

                                email:
                                    teacherEmail,

                                newPassword:
                                    newPassword,

                                confirmPassword:
                                    confirmPassword

                            })

                    }
                );



            /* =========================================
               READ SERVER RESPONSE
            ========================================= */

            const data =
                await response.json();



            /* =========================================
               SERVER ERROR
            ========================================= */

            if (
                !response.ok ||
                !data.success
            ) {

                showMessage(

                    data.message ||
                    "Unable to reset password.",

                    "error"

                );

                resetButton.disabled = false;

                resetButton.textContent =
                    "Reset Password";

                return;

            }



            /* =========================================
               SUCCESS
            ========================================= */

            showMessage(

                "✓ Password reset successful! Redirecting to Teacher Login...",

                "success"

            );


            form.reset();



            /* =========================================
               REDIRECT
            ========================================= */

            setTimeout(
                function() {

                    window.location.href =
                        "teacher login.html";

                },
                1500
            );


        } catch (error) {


            console.error(
                "PASSWORD RESET ERROR:",
                error
            );


            showMessage(

                "Unable to connect to the school portal server. Please make sure the backend is running.",

                "error"

            );


            resetButton.disabled = false;

            resetButton.textContent =
                "Reset Password";

        }

    }
);



/* =====================================================
   SHOW / HIDE NEW PASSWORD
===================================================== */

newPasswordEye.addEventListener(
    "click",
    function() {

        if (
            newPasswordInput.type ===
            "password"
        ) {

            newPasswordInput.type =
                "text";

            newPasswordEye.textContent =
                "🙈";

        } else {

            newPasswordInput.type =
                "password";

            newPasswordEye.textContent =
                "👁️";

        }

    }
);



/* =====================================================
   SHOW / HIDE CONFIRM PASSWORD
===================================================== */

confirmPasswordEye.addEventListener(
    "click",
    function() {

        if (
            confirmPasswordInput.type ===
            "password"
        ) {

            confirmPasswordInput.type =
                "text";

            confirmPasswordEye.textContent =
                "🙈";

        } else {

            confirmPasswordInput.type =
                "password";

            confirmPasswordEye.textContent =
                "👁️";

        }

    }
);


</script>


</body>

</html>
