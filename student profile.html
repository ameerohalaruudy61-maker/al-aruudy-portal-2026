<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Profile | Al-Aruudy International School</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f2;
            color: #333;
        }

        header {
            background: #0b6b3a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
        }

        .back-btn {
            background: #f4c400;
            color: #222;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 30px auto;
        }

        .profile-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .passport {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #f4c400;
            margin-bottom: 15px;
        }

        .profile-initial {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #0b6b3a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: bold;
            margin: 0 auto 15px;
            border: 5px solid #f4c400;
        }

        .profile-header h2 {
            color: #0b6b3a;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #777;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .detail-box {
            background: #f5f7f2;
            padding: 16px;
            border-radius: 8px;
        }

        .detail-box strong {
            display: block;
            color: #0b6b3a;
            margin-bottom: 7px;
        }

        .detail-box span {
            color: #444;
            word-break: break-word;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-btn {
            background: #0b6b3a;
            color: white;
        }

        .password-btn {
            background: #f4c400;
            color: #222;
        }

        .not-found {
            text-align: center;
            padding: 50px 20px;
        }

        .not-found h2 {
            color: #0b6b3a;
            margin-bottom: 10px;
        }

        .login-link {
            display: inline-block;
            margin-top: 20px;
            background: #0b6b3a;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 7px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background: #0b6b3a;
            color: white;
        }

        @media (max-width: 650px) {

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 17px;
            }

            .container {
                width: 94%;
            }

            .profile-card {
                padding: 20px;
            }

            .details {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <header>

        <h1>
            Al-Aruudy International School
        </h1>

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Dashboard
        </button>

    </header>


    <main class="container">

        <div
            id="profileContainer"
            class="profile-card"
        >

            <div class="not-found">

                <h2>
                    Loading Student Profile...
                </h2>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Al-Aruudy International School. All Rights Reserved.
        </p>

    </footer>


    <script>

        function loadStudentProfile() {

            /*
                Get the student saved during login.
            */

            const currentStudent =
                localStorage.getItem("currentStudent");


            /*
                If currentStudent exists,
                load it.
            */

            if (currentStudent) {

                try {

                    const student =
                        JSON.parse(currentStudent);

                    displayStudent(student);

                    return;

                } catch (error) {

                    console.log(
                        "currentStudent could not be read:",
                        error
                    );

                }

            }


            /*
                Backup:
                Read the older localStorage values
                that the login page also saves.
            */

            const studentName =
                localStorage.getItem("studentName");

            const studentId =
                localStorage.getItem("studentId");

            const studentClass =
                localStorage.getItem("studentClass");

            const studentSession =
                localStorage.getItem("studentSession");

            const studentEmail =
                localStorage.getItem("studentEmail");


            /*
                If even the backup information
                doesn't exist, the student is not logged in.
            */

            if (!studentName && !studentId) {

                showLoginMessage();

                return;

            }


            /*
                Build student object from
                the backup localStorage values.
            */

            const student = {

                fullName: studentName || "Student",

                studentId: studentId || "-",

                studentClass: studentClass || "-",

                session: studentSession || "-",

                email: studentEmail || "-",

                dateOfBirth: "-",

                gender: "-",

                phone: "-",

                address: "-",

                parentName: "-",

                parentPhone: "-",

                passport:
                    localStorage.getItem("studentPassport") || ""

            };


            displayStudent(student);

        }


        function displayStudent(student) {

            const container =
                document.getElementById("profileContainer");


            const name =
                student.fullName ||
                student.studentName ||
                localStorage.getItem("studentName") ||
                "Student";


            const studentId =
                student.studentId ||
                localStorage.getItem("studentId") ||
                "-";


            const dateOfBirth =
                student.dateOfBirth || "-";


            const gender =
                student.gender || "-";


            const studentClass =
                student.studentClass ||
                localStorage.getItem("studentClass") ||
                "-";


            const session =
                student.session ||
                student.studentSession ||
                localStorage.getItem("studentSession") ||
                "-";


            const email =
                student.email ||
                localStorage.getItem("studentEmail") ||
                "-";


            const phone =
                student.phone || "-";


            const address =
                student.address || "-";


            const parentName =
                student.parentName || "-";


            const parentPhone =
                student.parentPhone || "-";


            const passport =
                student.passport ||
                localStorage.getItem("studentPassport") ||
                "";


            let picture;


            if (passport) {

                picture = `
                    <img
                        src="${passport}"
                        class="passport"
                        alt="Student Passport"
                    >
                `;

            } else {

                picture = `
                    <div class="profile-initial">
                        ${escapeHTML(name.charAt(0).toUpperCase())}
                    </div>
                `;

            }


            container.innerHTML = `

                <div class="profile-header">

                    ${picture}

                    <h2>
                        ${escapeHTML(name)}
                    </h2>

                    <p>
                        Student Profile
                    </p>

                </div>


                <div class="details">

                    <div class="detail-box">
                        <strong>Full Name</strong>
                        <span>
                            ${escapeHTML(name)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Student ID</strong>
                        <span>
                            ${escapeHTML(studentId)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Date of Birth</strong>
                        <span>
                            ${escapeHTML(dateOfBirth)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Gender</strong>
                        <span>
                            ${escapeHTML(gender)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Class</strong>
                        <span>
                            ${escapeHTML(studentClass)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Academic Session</strong>
                        <span>
                            ${escapeHTML(session)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Email</strong>
                        <span>
                            ${escapeHTML(email)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Phone</strong>
                        <span>
                            ${escapeHTML(phone)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Home Address</strong>
                        <span>
                            ${escapeHTML(address)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Parent / Guardian</strong>
                        <span>
                            ${escapeHTML(parentName)}
                        </span>
                    </div>


                    <div class="detail-box">
                        <strong>Parent / Guardian Phone</strong>
                        <span>
                            ${escapeHTML(parentPhone)}
                        </span>
                    </div>

                </div>


                <div class="actions">

                    <button
                        class="action-btn edit-btn"
                        onclick="editProfile()"
                    >
                        ✏️ Edit Profile
                    </button>


                    <button
                        class="action-btn password-btn"
                        onclick="changePassword()"
                    >
                        🔒 Change Password
                    </button>

                </div>

            `;

        }


        function showLoginMessage() {

            const container =
                document.getElementById("profileContainer");

            container.innerHTML = `

                <div class="not-found">

                    <h2>
                        Student Profile Not Found
                    </h2>

                    <p>
                        Please login first to view your profile.
                    </p>

                    <a
                        href="new student login portal.html"
                        class="login-link"
                    >
                        Go to Student Login
                    </a>

                </div>

            `;

        }


        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function editProfile() {

            alert(
                "Edit Profile will be connected to the database next."
            );

        }


        function changePassword() {

            alert(
                "Change Password will be connected to the database next."
            );

        }


        function goBack() {

            window.location.href =
                "studentdashboard.html";

        }


        /*
            Start loading the profile.
        */

        loadStudentProfile();

    </script>

</body>

</html>
